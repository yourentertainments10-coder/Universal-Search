<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Universal Personal Search</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Universal Search</h1>
    <p class="tagline">Find anything you saved, using the way you remember it. Everything stays on this computer.</p>
  </header>

  <main>
    <section class="panel">
      <label for="folder">Folder to scan</label>
      <div class="row">
        <input id="folder" type="text" placeholder="C:\Users\You\Pictures">
        <button id="scanBtn">Scan</button>
      </div>
      <p id="status" class="status"></p>
    </section>

    <section class="panel">
      <div class="row between">
        <strong>Indexing</strong>
        <div class="row">
          <button id="startBtn" class="secondary">Start</button>
          <button id="pauseBtn" class="secondary">Pause</button>
          <button id="retryBtn" class="secondary">Retry failed</button>
        </div>
      </div>
      <div class="bar"><div id="barFill"></div></div>
      <p id="indexStatus" class="status"></p>
      <p id="ocrStatus" class="status"></p>
    </section>

    <section class="panel">
      <div class="row filters">
        <button class="chip active" data-type="">All</button>
        <button class="chip" data-type="image">Images</button>
        <button class="chip" data-type="pdf">PDFs</button>
        <button class="chip" data-type="document">Documents</button>
      </div>
      <div id="results" class="grid"></div>
    </section>
  </main>

  <dialog id="textDialog">
    <div class="dialog-head">
      <strong id="dlgTitle"></strong>
      <button id="dlgClose" class="secondary">Close</button>
    </div>
    <p id="dlgMeta" class="status"></p>
    <pre id="dlgText"></pre>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
