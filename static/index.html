<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Universal Personal Search</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Universal Search</h1>
    <p class="tagline">Find anything you saved, using the way you remember it. Everything stays on this computer.</p>
  </header>

  <main>
    <section class="panel">
      <input id="q" type="search" autofocus autocomplete="off" spellcheck="false"
             placeholder="Search files, text inside screenshots and PDFs...  e.g.  trigonometry formula   or   &quot;college farewell&quot;">
      <div class="row filters">
        <button class="chip active" data-type="">All</button>
        <button class="chip" data-type="image">Images</button>
        <button class="chip" data-type="pdf">PDFs</button>
        <button class="chip" data-type="document">Documents</button>
        <label class="inline">From <input type="date" id="dateFrom"></label>
        <label class="inline">To <input type="date" id="dateTo"></label>
        <select id="statusFilter" aria-label="Filter by indexing status">
          <option value="">Any status</option>
          <option value="failed">Failed</option>
          <option value="needs_ocr">Needs OCR</option>
          <option value="pending">Waiting</option>
          <option value="skipped">Skipped</option>
        </select>
        <select id="sort" aria-label="Sort order">
          <option value="relevance">Best match</option>
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
        </select>
        <button id="clearBtn" class="secondary">Clear</button>
      </div>
      <p id="resultInfo" class="status"></p>
      <div id="results" class="list"></div>
      <button id="moreBtn" class="secondary more-btn" hidden>Show more</button>
    </section>

    <details id="manage" class="panel" open>
      <summary>Folders and indexing</summary>

      <label for="folder">Add or rescan a folder</label>
      <div class="row">
        <input id="folder" type="text" placeholder="C:\Users\You\Pictures">
        <button id="scanBtn">Scan</button>
        <button id="rescanAllBtn" class="secondary">Rescan all</button>
      </div>
      <p id="status" class="status"></p>
      <div id="roots" class="roots"></div>

      <div class="row between index-head">
        <strong>Indexing</strong>
        <div class="row">
          <button id="startBtn" class="secondary">Start</button>
          <button id="pauseBtn" class="secondary">Pause</button>
          <button id="retryBtn" class="secondary">Retry failed</button>
        </div>
      </div>
      <div class="bar"><div id="barFill"></div></div>
      <p id="indexStatus" class="status"></p>
      <p id="ocrStatus" class="status"></p>

      <div class="danger">
        <button id="resetBtn" class="secondary danger-btn">Reset search index</button>
        <span class="status">Deletes the index and previews. Your original files are never touched.</span>
      </div>
    </details>
  </main>

  <dialog id="textDialog">
    <div class="dialog-head">
      <strong id="dlgTitle"></strong>
      <button id="dlgClose" class="secondary">Close</button>
    </div>
    <p id="dlgMeta" class="status"></p>
    <pre id="dlgText"></pre>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
